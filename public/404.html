<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Visal Saosuo</title>
    <script>
      // Redirect deep links to index.html so React Router can handle them.
      // GitHub Pages serves 404.html for unknown paths; we rewrite to /?p=<path>
      // and index.html reads it back via the companion script.
      var l = window.location
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash)
    </script>
  </head>
  <body></body>
</html>
