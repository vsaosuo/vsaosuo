    <script>
      // Apply dark class before React mounts to prevent flash of unstyled content.
      ;(function () {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
      // Restore path rewritten by 404.html for GitHub Pages SPA deep-link support.
      ;(function () {
        var p = new URLSearchParams(window.location.search).get('p')
        if (p) window.history.replaceState(null, '', decodeURIComponent(p))
      })()
    </script>
